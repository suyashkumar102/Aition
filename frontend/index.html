<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THEMIS — Causal AI Fairness Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header h1 { font-size: 2.5rem; font-weight: 800; color: #7C3AED; letter-spacing: -0.02em; }
    header p  { color: #94a3b8; margin-top: 0.5rem; font-size: 1rem; }

    /* ── Control Bar ─────────────────────────────────────────────────────── */
    #controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    #btn-demo {
      background: #7C3AED;
      color: #fff;
      border: none;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #btn-demo:hover { background: #6d28d9; }

    #file-label {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    #file-label:hover { border-color: #7C3AED; }
    #csv-input { display: none; }

    /* ── Loading ─────────────────────────────────────────────────────────── */
    #loading {
      display: none;
      text-align: center;
      padding: 2rem;
      color: #94a3b8;
      font-size: 1.1rem;
    }
    #loading span { animation: pulse-text 1.2s ease-in-out infinite; }
    @keyframes pulse-text { 0%,100% { opacity:1 } 50% { opacity:0.4 } }

    /* ── Error ───────────────────────────────────────────────────────────── */
    #error-box {
      display: none;
      background: #450a0a;
      border: 1px solid #DC2626;
      border-radius: 8px;
      padding: 1rem 1.5rem;
      color: #fca5a5;
      margin-bottom: 1.5rem;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Results Section ─────────────────────────────────────────────────── */
    #results { display: none; }

    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 700px) { .panels { grid-template-columns: 1fr; } }

    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
    }
    .panel h2 { font-size: 1rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }

    .badge {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .badge-fair    { background: #14532d; color: #86efac; }
    .badge-biased  { background: #450a0a; color: #fca5a5; }
    .badge-proxy   { background: #450a0a; color: #fca5a5; }
    .badge-no-proxy { background: #14532d; color: #86efac; }

    .metric-label { color: #94a3b8; font-size: 0.85rem; margin-bottom: 0.25rem; }
    .metric-value { font-size: 1.4rem; font-weight: 700; color: #e2e8f0; margin-bottom: 1rem; }

    .proxy-list { list-style: none; margin-top: 0.5rem; }
    .proxy-list li {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.6rem 0.9rem;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .proxy-list li strong { color: #f87171; }

    .affected-count {
      margin-top: 1rem;
      background: #1c1917;
      border: 1px solid #DC2626;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      color: #fca5a5;
      font-size: 0.9rem;
    }
    .affected-count strong { font-size: 1.2rem; color: #f87171; }

    /* ── Graph ───────────────────────────────────────────────────────────── */
    #graph-section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    #graph-section h2 { font-size: 1rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }
    #graph-svg { width: 100%; min-height: 400px; display: block; }

    /* ── Report Card ─────────────────────────────────────────────────────── */
    #report-section {
      display: none;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    #report-section h2 { font-size: 1rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }
    #report-text { white-space: pre-wrap; font-size: 0.9rem; line-height: 1.7; color: #cbd5e1; }

    /* ── Tooltip ─────────────────────────────────────────────────────────── */
    #tooltip {
      position: fixed;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
      color: #e2e8f0;
      pointer-events: none;
      display: none;
      z-index: 100;
      max-width: 220px;
    }

    /* ── Proxy edge pulse ────────────────────────────────────────────────── */
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }
    .proxy-edge { animation: pulse 1.8s ease-in-out infinite; }
  </style>
</head>
<body>

<header>
  <h1>THEMIS</h1>
  <p>Causal AI Fairness Engine — Proxy Discrimination Detection</p>
</header>

<!-- Control Bar -->
<div id="controls">
  <button id="btn-demo">Use Demo Dataset</button>
  <label id="file-label" for="csv-input">Upload CSV Dataset</label>
  <input type="file" id="csv-input" accept=".csv" />
</div>

<!-- Loading -->
<div id="loading"><span>Running causal audit...</span></div>

<!-- Error -->
<div id="error-box" role="alert"></div>

<!-- Results -->
<div id="results">
  <div class="panels">
    <!-- Standard Audit Panel -->
    <div class="panel" id="standard-panel">
      <h2>Standard Audit (AIF360)</h2>
      <div id="standard-badge"></div>
      <div class="metric-label">Demographic Parity Difference</div>
      <div class="metric-value" id="dpd-value">—</div>
    </div>

    <!-- THEMIS Causal Audit Panel -->
    <div class="panel" id="causal-panel">
      <h2>THEMIS Causal Audit</h2>
      <div id="causal-badge"></div>
      <div class="metric-label">Proxy Paths Found</div>
      <div class="metric-value" id="proxy-count">—</div>
      <ul class="proxy-list" id="proxy-list"></ul>
      <div class="affected-count" id="affected-count" style="display:none"></div>
    </div>
  </div>

  <!-- Causal Graph -->
  <div id="graph-section">
    <h2>Causal Graph</h2>
    <svg id="graph-svg"></svg>
  </div>
</div>

<!-- Report Card -->
<div id="report-section">
  <h2>Plain-Language Report</h2>
  <pre id="report-text"></pre>
</div>

<!-- Tooltip -->
<div id="tooltip"></div>

<script>
// ── API ───────────────────────────────────────────────────────────────────────
const API_BASE = 'http://localhost:8000';

// ── Helpers ───────────────────────────────────────────────────────────────────
function show(id)  { document.getElementById(id).style.display = ''; }
function hide(id)  { document.getElementById(id).style.display = 'none'; }
function block(id) { document.getElementById(id).style.display = 'block'; }

// ── runAudit ──────────────────────────────────────────────────────────────────
async function runAudit(formData) {
  hide('error-box');
  hide('results');
  hide('report-section');
  block('loading');

  try {
    const res = await fetch(`${API_BASE}/audit`, { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) {
      showError(`HTTP ${res.status}: ${data.error || data.detail || 'Unknown error'}`);
      return;
    }
    renderResults(data);
  } catch (err) {
    showError(`Network error: ${err.message}`);
  } finally {
    hide('loading');
  }
}

// ── showError ─────────────────────────────────────────────────────────────────
function showError(message) {
  hide('results');
  hide('report-section');
  const box = document.getElementById('error-box');
  box.textContent = message;
  block('error-box');
}

// ── renderResults ─────────────────────────────────────────────────────────────
function renderResults(data) {
  const sa = data.standard_audit;
  const ca = data.causal_audit;

  // Standard Audit panel
  const stdBadge = document.getElementById('standard-badge');
  if (sa.passes_standard_test) {
    stdBadge.innerHTML = '<span class="badge badge-fair">FAIR ✓</span>';
  } else {
    stdBadge.innerHTML = '<span class="badge badge-biased">BIASED ✗</span>';
  }
  document.getElementById('dpd-value').textContent = sa.demographic_parity_difference.toFixed(4);

  // Causal Audit panel
  const causalBadge = document.getElementById('causal-badge');
  if (ca.proxy_paths_found > 0) {
    causalBadge.innerHTML = '<span class="badge badge-proxy">PROXY DISCRIMINATION DETECTED</span>';
  } else {
    causalBadge.innerHTML = '<span class="badge badge-no-proxy">NO PROXY PATHS FOUND</span>';
  }
  document.getElementById('proxy-count').textContent = ca.proxy_paths_found;

  // Proxy path list
  const list = document.getElementById('proxy-list');
  list.innerHTML = '';
  ca.paths.forEach(p => {
    const li = document.createElement('li');
    li.innerHTML = `<strong>${p.path.join(' → ')}</strong><br>Effect: ${p.effect.toFixed(3)} — ${p.description}`;
    list.appendChild(li);
  });

  // Affected candidates
  const affectedDiv = document.getElementById('affected-count');
  if (ca.affected_candidates > 0) {
    affectedDiv.innerHTML = `<strong>${ca.affected_candidates}</strong> qualified female candidates estimated wrongly rejected`;
    affectedDiv.style.display = 'block';
  } else {
    affectedDiv.style.display = 'none';
  }

  // Show results section
  block('results');

  // Render graph
  renderGraph(data.graph_data);

  // Report card
  if (data.plain_language_report) {
    document.getElementById('report-text').textContent = data.plain_language_report;
    block('report-section');
  }
}

// ── renderGraph ───────────────────────────────────────────────────────────────
function renderGraph(graphData) {
  const container = document.getElementById('graph-section');
  const width  = container.clientWidth - 48;
  const height = Math.max(400, 600);

  const svg = d3.select('#graph-svg')
    .attr('viewBox', `0 0 ${width} ${height}`)
    .attr('width', width)
    .attr('height', height);

  svg.selectAll('*').remove();

  // Defs: arrowheads
  const defs = svg.append('defs');
  ['proxy', 'legitimate'].forEach(type => {
    defs.append('marker')
      .attr('id', `arrow-${type}`)
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 22)
      .attr('refY', 0)
      .attr('markerWidth', 6)
      .attr('markerHeight', 6)
      .attr('orient', 'auto')
      .append('path')
        .attr('d', 'M0,-5L10,0L0,5')
        .attr('fill', type === 'proxy' ? '#DC2626' : '#16A34A');
  });

  const nodes = graphData.nodes.map(n => ({ ...n }));
  const links = graphData.edges.map(e => ({ ...e }));

  const simulation = d3.forceSimulation(nodes)
    .force('link',   d3.forceLink(links).id(d => d.id).distance(120))
    .force('charge', d3.forceManyBody().strength(-400))
    .force('center', d3.forceCenter(width / 2, height / 2));

  // Edges
  const edgeGroup = svg.append('g').attr('class', 'edges');
  const link = renderEdges(edgeGroup, links);

  // Edge labels
  const edgeLabel = svg.append('g').selectAll('text')
    .data(links).enter().append('text')
      .attr('font-size', 10)
      .attr('fill', '#94a3b8')
      .attr('text-anchor', 'middle')
      .text(d => d.strength.toFixed(2));

  // Nodes
  const nodeGroup = svg.append('g').attr('class', 'nodes');
  const node = renderNode(nodeGroup, nodes);

  // Entrance animation
  node.attr('opacity', 0).transition().duration(600).attr('opacity', 1);
  link.attr('opacity', 0).transition().delay(600).duration(800).attr('opacity', 1);
  edgeLabel.attr('opacity', 0).transition().delay(600).duration(800).attr('opacity', 1);

  // Proxy pulse
  animateProxyPaths(svg, links);

  // Simulation tick
  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);

    edgeLabel
      .attr('x', d => (d.source.x + d.target.x) / 2)
      .attr('y', d => (d.source.y + d.target.y) / 2 - 6);

    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  // Legend
  renderLegend(svg, width, height);
}

// ── renderEdges ───────────────────────────────────────────────────────────────
function renderEdges(selection, links) {
  return selection.selectAll('line')
    .data(links).enter().append('line')
      .attr('stroke',       d => d.type === 'proxy' ? '#DC2626' : '#16A34A')
      .attr('stroke-width', d => d.type === 'proxy' ? 3 : 2)
      .attr('class',        d => d.type === 'proxy' ? 'proxy-edge' : '')
      .attr('marker-end',   d => `url(#arrow-${d.type})`);
}

// ── renderNode ────────────────────────────────────────────────────────────────
const NODE_COLORS = {
  protected:  '#7C3AED',
  proxy:      '#DC2626',
  legitimate: '#16A34A',
  outcome:    '#6B7280',
};

function renderNode(selection, nodes) {
  const tooltip = document.getElementById('tooltip');

  const NODE_ROLES = {
    protected:  'Protected attribute: must not causally influence the outcome',
    proxy:      'Proxy variable: correlates with gender, influences hiring outcome',
    legitimate: 'Legitimate variable: valid, non-discriminatory factor',
    outcome:    'Outcome variable: the hiring decision',
  };

  const g = selection.selectAll('g')
    .data(nodes).enter().append('g')
      .attr('cursor', 'pointer')
      .call(d3.drag()
        .on('start', (event, d) => { if (!event.active) event.sourceEvent.target.__sim?.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag',  (event, d) => { d.fx = event.x; d.fy = event.y; })
        .on('end',   (event, d) => { if (!event.active) event.sourceEvent.target.__sim?.alphaTarget(0); d.fx = null; d.fy = null; })
      )
      .on('click', (event, d) => showTooltip(event, d))
      .on('mouseleave', () => { tooltip.style.display = 'none'; });

  g.append('circle')
    .attr('r', 18)
    .attr('fill', d => NODE_COLORS[d.type] || '#6B7280')
    .attr('stroke', '#0f172a')
    .attr('stroke-width', 2);

  g.append('text')
    .attr('dy', 32)
    .attr('text-anchor', 'middle')
    .attr('font-size', 11)
    .attr('fill', '#e2e8f0')
    .text(d => d.label);

  return g;
}

// ── animateProxyPaths ─────────────────────────────────────────────────────────
function animateProxyPaths(svg, links) {
  // CSS animation already applied via .proxy-edge class — nothing extra needed
}

// ── showTooltip ───────────────────────────────────────────────────────────────
const NODE_ROLES = {
  protected:  'Protected attribute: must not causally influence the outcome',
  proxy:      'Proxy variable: correlates with gender, influences hiring outcome',
  legitimate: 'Legitimate variable: valid, non-discriminatory factor',
  outcome:    'Outcome variable: the hiring decision',
};

function showTooltip(event, node) {
  const tooltip = document.getElementById('tooltip');
  tooltip.innerHTML = `<strong>${node.label}</strong><br>${NODE_ROLES[node.type] || node.type}`;
  tooltip.style.display = 'block';
  tooltip.style.left = (event.clientX + 12) + 'px';
  tooltip.style.top  = (event.clientY + 12) + 'px';
}

// ── renderLegend ──────────────────────────────────────────────────────────────
function renderLegend(svg, width, height) {
  const items = [
    { color: '#7C3AED', label: 'Protected attribute' },
    { color: '#DC2626', label: 'Proxy variable' },
    { color: '#16A34A', label: 'Legitimate variable' },
    { color: '#6B7280', label: 'Outcome' },
    { color: '#DC2626', label: 'Proxy edge', isLine: true },
    { color: '#16A34A', label: 'Legitimate edge', isLine: true },
  ];

  const legend = svg.append('g').attr('transform', `translate(12, ${height - items.length * 20 - 12})`);

  items.forEach((item, i) => {
    const row = legend.append('g').attr('transform', `translate(0, ${i * 20})`);
    if (item.isLine) {
      row.append('line')
        .attr('x1', 0).attr('y1', 7).attr('x2', 16).attr('y2', 7)
        .attr('stroke', item.color).attr('stroke-width', item.label.includes('Proxy') ? 3 : 2);
    } else {
      row.append('circle').attr('cx', 8).attr('cy', 7).attr('r', 7).attr('fill', item.color);
    }
    row.append('text')
      .attr('x', 22).attr('y', 11)
      .attr('font-size', 11).attr('fill', '#94a3b8')
      .text(item.label);
  });
}

// ── Event Wiring ──────────────────────────────────────────────────────────────
document.getElementById('btn-demo').addEventListener('click', () => {
  runAudit(new FormData());
});

document.getElementById('csv-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  runAudit(fd);
});
</script>
</body>
</html>
