<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aition — Causal AI Fairness Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header h1 { font-size: 2.5rem; font-weight: 800; color: #7C3AED; letter-spacing: -0.02em; }
    header p  { color: #94a3b8; margin-top: 0.5rem; font-size: 1rem; }

    /* ── Control Bar ─────────────────────────────────────────────────────── */
    #controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    #btn-demo {
      background: #7C3AED;
      color: #fff;
      border: none;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #btn-demo:hover { background: #6d28d9; }

    #file-label {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    #file-label:hover { border-color: #7C3AED; }
    #csv-input { display: none; }

    /* ── Loading ─────────────────────────────────────────────────────────── */
    #loading {
      display: none;
      text-align: center;
      padding: 2rem;
      color: #94a3b8;
      font-size: 1.1rem;
    }
    #loading span { animation: pulse-text 1.2s ease-in-out infinite; }
    @keyframes pulse-text { 0%,100% { opacity:1 } 50% { opacity:0.4 } }

    /* ── Error ───────────────────────────────────────────────────────────── */
    #error-box {
      display: none;
      background: #450a0a;
      border: 1px solid #DC2626;
      border-radius: 8px;
      padding: 1rem 1.5rem;
      color: #fca5a5;
      margin-bottom: 1.5rem;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Results Section ─────────────────────────────────────────────────── */
    #results { display: none; }

    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 700px) { .panels { grid-template-columns: 1fr; } }

    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
    }
    .panel h2 { font-size: 1rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }

    .badge {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .badge-fair    { background: #14532d; color: #86efac; }
    .badge-biased  { background: #450a0a; color: #fca5a5; }
    .badge-proxy   { background: #450a0a; color: #fca5a5; }
    .badge-no-proxy { background: #14532d; color: #86efac; }

    .metric-label { color: #94a3b8; font-size: 0.85rem; margin-bottom: 0.25rem; }
    .metric-value { font-size: 1.4rem; font-weight: 700; color: #e2e8f0; margin-bottom: 1rem; }

    .proxy-list { list-style: none; margin-top: 0.5rem; }
    .proxy-list li {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.6rem 0.9rem;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .proxy-list li strong { color: #f87171; }

    .affected-count {
      margin-top: 1rem;
      background: #1c1917;
      border: 1px solid #DC2626;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      color: #fca5a5;
      font-size: 0.9rem;
    }
    .affected-count strong { font-size: 1.2rem; color: #f87171; }

    /* ── Graph ───────────────────────────────────────────────────────────── */
    #graph-section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    #graph-section h2 { font-size: 1rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }
    #graph-svg { width: 100%; height: 520px; display: block; }

    /* ── Report Card ─────────────────────────────────────────────────────── */
    #report-section {
      display: none;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    #report-section h2 { font-size: 1rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }

    /* Markdown rendered report */
    #report-text { font-size: 0.92rem; line-height: 1.8; color: #cbd5e1; }
    #report-text h1, #report-text h2, #report-text h3 { color: #e2e8f0; margin: 1.2rem 0 0.5rem; font-weight: 700; }
    #report-text h1 { font-size: 1.4rem; }
    #report-text h2 { font-size: 1.15rem; border-bottom: 1px solid #334155; padding-bottom: 0.3rem; }
    #report-text h3 { font-size: 1rem; color: #a78bfa; }
    #report-text p  { margin-bottom: 0.75rem; }
    #report-text ul, #report-text ol { padding-left: 1.5rem; margin-bottom: 0.75rem; }
    #report-text li { margin-bottom: 0.3rem; }
    #report-text strong { color: #f1f5f9; }
    #report-text hr { border-color: #334155; margin: 1rem 0; }
    #report-text code { background: #0f172a; padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.85em; }

    #btn-download-pdf {
      background: #1e293b;
      border: 1px solid #7C3AED;
      color: #a78bfa;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 1rem;
      display: inline-block;
    }
    #btn-download-pdf:hover { background: #2d1f5e; }
    #tooltip {
      position: fixed;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
      color: #e2e8f0;
      pointer-events: none;
      display: none;
      z-index: 100;
      max-width: 220px;
    }

    /* ── Proxy edge pulse ────────────────────────────────────────────────── */
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }
    .proxy-edge { animation: pulse 1.8s ease-in-out infinite; }
  </style>
</head>
<body>

<header>
  <h1>Aition</h1>
  <p>Causal AI Fairness Engine — Proxy Discrimination Detection</p>
</header>

<!-- Control Bar -->
<div id="controls">
  <button id="btn-demo">Use Demo Dataset</button>
  <label id="file-label" for="csv-input">Upload CSV Dataset</label>
  <input type="file" id="csv-input" accept=".csv" />
</div>

<!-- Loading -->
<div id="loading"><span>Running causal audit...</span></div>

<!-- Error -->
<div id="error-box" role="alert"></div>

<!-- Results -->
<div id="results">
  <div class="panels">
    <!-- Standard Audit Panel -->
    <div class="panel" id="standard-panel">
      <h2>Standard Audit (AIF360)</h2>
      <div id="standard-badge"></div>
      <div class="metric-label">Demographic Parity Difference</div>
      <div class="metric-value" id="dpd-value">—</div>
    </div>

    <!-- THEMIS Causal Audit Panel -->
    <div class="panel" id="causal-panel">
      <h2>Aition Causal Audit</h2>
      <div id="causal-badge"></div>
      <div class="metric-label">Proxy Paths Found</div>
      <div class="metric-value" id="proxy-count">—</div>
      <ul class="proxy-list" id="proxy-list"></ul>
      <div class="affected-count" id="affected-count" style="display:none"></div>
    </div>
  </div>

  <!-- Causal Graph -->
  <div id="graph-section">
    <h2>Causal Graph</h2>
    <svg id="graph-svg"></svg>
  </div>
</div>

<!-- Report Card -->
<div id="report-section">
  <h2>Plain-Language Report</h2>
  <button id="btn-download-pdf">⬇ Download as PDF</button>
  <div id="report-text"></div>
</div>

<!-- Tooltip -->
<div id="tooltip"></div>

<script>
// ── API ───────────────────────────────────────────────────────────────────────
const API_BASE = 'http://localhost:8000';

// ── Helpers ───────────────────────────────────────────────────────────────────
function show(id)  { document.getElementById(id).style.display = ''; }
function hide(id)  { document.getElementById(id).style.display = 'none'; }
function block(id) { document.getElementById(id).style.display = 'block'; }

// ── runAudit ──────────────────────────────────────────────────────────────────
async function runAudit(formData) {
  hide('error-box');
  hide('results');
  hide('report-section');
  block('loading');

  try {
    const res = await fetch(`${API_BASE}/audit`, { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) {
      showError(`HTTP ${res.status}: ${data.error || data.detail || 'Unknown error'}`);
      return;
    }
    renderResults(data);
  } catch (err) {
    showError(`Network error: ${err.message}`);
  } finally {
    hide('loading');
  }
}

// ── showError ─────────────────────────────────────────────────────────────────
function showError(message) {
  hide('results');
  hide('report-section');
  const box = document.getElementById('error-box');
  box.textContent = message;
  block('error-box');
}

// ── renderResults ─────────────────────────────────────────────────────────────
function renderResults(data) {
  const sa = data.standard_audit;
  const ca = data.causal_audit;

  // Standard Audit panel
  const stdBadge = document.getElementById('standard-badge');
  if (sa.passes_standard_test) {
    stdBadge.innerHTML = '<span class="badge badge-fair">FAIR ✓</span>';
  } else {
    stdBadge.innerHTML = '<span class="badge badge-biased">BIASED ✗</span>';
  }
  document.getElementById('dpd-value').textContent = sa.demographic_parity_difference.toFixed(4);

  // Causal Audit panel
  const causalBadge = document.getElementById('causal-badge');
  if (ca.proxy_paths_found > 0) {
    causalBadge.innerHTML = '<span class="badge badge-proxy">PROXY DISCRIMINATION DETECTED</span>';
  } else {
    causalBadge.innerHTML = '<span class="badge badge-no-proxy">NO PROXY PATHS FOUND</span>';
  }
  document.getElementById('proxy-count').textContent = ca.proxy_paths_found;

  // Proxy path list
  const list = document.getElementById('proxy-list');
  list.innerHTML = '';
  ca.paths.forEach(p => {
    const li = document.createElement('li');
    li.innerHTML = `<strong>${p.path.join(' → ')}</strong><br>Effect: ${p.effect.toFixed(3)} — ${p.description}`;
    list.appendChild(li);
  });

  // Affected candidates
  const affectedDiv = document.getElementById('affected-count');
  if (ca.affected_candidates > 0) {
    affectedDiv.innerHTML = `<strong>${ca.affected_candidates}</strong> qualified female candidates estimated wrongly rejected`;
    affectedDiv.style.display = 'block';
  } else {
    affectedDiv.style.display = 'none';
  }

  // Show results section
  block('results');

  // Render graph
  renderGraph(data.graph_data);

  // Report card
  if (data.plain_language_report) {
    document.getElementById('report-text').innerHTML = marked.parse(data.plain_language_report);
    block('report-section');
  }
}

// ── renderGraph ───────────────────────────────────────────────────────────────
function renderGraph(graphData) {
  const container = document.getElementById('graph-section');
  const W = container.clientWidth - 48;
  const H = 520;

  const svg = d3.select('#graph-svg')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('width', W)
    .attr('height', H);

  svg.selectAll('*').remove();

  const R = 28;

  // Fixed layout — spread across full canvas
  const posMap = {
    'gender':         { x: W * 0.10, y: H * 0.50 },
    'college_tier':   { x: W * 0.38, y: H * 0.22 },
    'employment_gap': { x: W * 0.38, y: H * 0.78 },
    'hired':          { x: W * 0.65, y: H * 0.50 },
    'test_score':     { x: W * 0.88, y: H * 0.25 },
    'experience':     { x: W * 0.88, y: H * 0.75 },
  };

  const COLORS = { protected: '#7C3AED', proxy: '#DC2626', legitimate: '#16A34A', outcome: '#6B7280' };

  const nodes = graphData.nodes.map(n => ({ ...n, ...posMap[n.id] }));
  const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));
  const links = graphData.edges.map(e => ({
    ...e,
    source: nodeById[typeof e.source === 'string' ? e.source : e.source.id],
    target: nodeById[typeof e.target === 'string' ? e.target : e.target.id],
  }));

  // ── Defs ───────────────────────────────────────────────────────────────────
  const defs = svg.append('defs');

  // Arrowheads
  ['proxy', 'legitimate'].forEach(type => {
    defs.append('marker')
      .attr('id', `arr-${type}`)
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', R + 14).attr('refY', 0)
      .attr('markerWidth', 7).attr('markerHeight', 7)
      .attr('orient', 'auto')
      .append('path').attr('d', 'M0,-5L10,0L0,5')
        .attr('fill', type === 'proxy' ? '#DC2626' : '#16A34A');
  });

  // Glow filter for proxy edges
  const gf = defs.append('filter').attr('id', 'edge-glow');
  gf.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
  const gm = gf.append('feMerge');
  gm.append('feMergeNode').attr('in', 'blur');
  gm.append('feMergeNode').attr('in', 'SourceGraphic');

  // Node glow filters
  Object.entries(COLORS).forEach(([type, color]) => {
    const f = defs.append('filter').attr('id', `ng-${type}`)
      .attr('x', '-60%').attr('y', '-60%').attr('width', '220%').attr('height', '220%');
    f.append('feGaussianBlur').attr('in', 'SourceGraphic').attr('stdDeviation', '5').attr('result', 'blur');
    const m = f.append('feMerge');
    m.append('feMergeNode').attr('in', 'blur');
    m.append('feMergeNode').attr('in', 'SourceGraphic');
  });

  // ── Background subtle grid ─────────────────────────────────────────────────
  const bgG = svg.append('g').attr('opacity', 0.04);
  for (let x = 0; x < W; x += 40) bgG.append('line').attr('x1', x).attr('y1', 0).attr('x2', x).attr('y2', H).attr('stroke', '#94a3b8').attr('stroke-width', 1);
  for (let y = 0; y < H; y += 40) bgG.append('line').attr('x1', 0).attr('y1', y).attr('x2', W).attr('y2', y).attr('stroke', '#94a3b8').attr('stroke-width', 1);

  // ── Edges ──────────────────────────────────────────────────────────────────
  function ep(d) {
    const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    return { x1: d.source.x + dx/dist*R, y1: d.source.y + dy/dist*R,
             x2: d.target.x - dx/dist*(R+2), y2: d.target.y - dy/dist*(R+2) };
  }

  const edgeG = svg.append('g');
  const edgeLines = edgeG.selectAll('line').data(links).enter().append('line')
    .each(function(d) { const p = ep(d); d3.select(this).attr('x1',p.x1).attr('y1',p.y1).attr('x2',p.x2).attr('y2',p.y2); })
    .attr('stroke', d => d.type === 'proxy' ? '#DC2626' : '#16A34A')
    .attr('stroke-width', d => d.type === 'proxy' ? 4 : 2.5)
    .attr('stroke-opacity', 0.9)
    .attr('class', d => d.type === 'proxy' ? 'proxy-edge' : '')
    .attr('filter', d => d.type === 'proxy' ? 'url(#edge-glow)' : null)
    .attr('marker-end', d => `url(#arr-${d.type})`);

  // Edge strength pill labels
  edgeG.selectAll('g.elabel').data(links).enter().append('g').attr('class', 'elabel')
    .each(function(d) {
      const mx = (d.source.x + d.target.x) / 2 + (d.target.y - d.source.y) * 0.13;
      const my = (d.source.y + d.target.y) / 2 - (d.target.x - d.source.x) * 0.13;
      const g = d3.select(this);
      g.append('rect').attr('x', mx - 16).attr('y', my - 9).attr('width', 32).attr('height', 16)
        .attr('rx', 8).attr('fill', '#0f172a').attr('stroke', d.type === 'proxy' ? '#DC2626' : '#16A34A')
        .attr('stroke-width', 1).attr('opacity', 0.85);
      g.append('text').attr('x', mx).attr('y', my + 4)
        .attr('text-anchor', 'middle').attr('font-size', 10).attr('font-weight', '700')
        .attr('fill', d.type === 'proxy' ? '#fca5a5' : '#86efac')
        .text(d.strength.toFixed(2));
    });

  // ── Nodes ──────────────────────────────────────────────────────────────────
  const ROLES = {
    protected:  'Protected attribute: must not causally influence the outcome',
    proxy:      'Proxy variable: correlates with gender, influences hiring outcome',
    legitimate: 'Legitimate variable: valid, non-discriminatory factor',
    outcome:    'Outcome variable: the hiring decision',
  };

  const nodeG = svg.append('g');
  const ng = nodeG.selectAll('g').data(nodes).enter().append('g')
    .attr('transform', d => `translate(${d.x},${d.y})`)
    .attr('cursor', 'pointer')
    .on('mouseenter', (event, d) => {
      const tip = document.getElementById('tooltip');
      tip.innerHTML = `<strong>${d.label}</strong><br><span style="color:#94a3b8;font-size:0.75rem">${ROLES[d.type]}</span>`;
      tip.style.display = 'block';
      tip.style.left = (event.clientX + 14) + 'px';
      tip.style.top  = (event.clientY + 14) + 'px';
    })
    .on('mousemove', event => {
      const tip = document.getElementById('tooltip');
      tip.style.left = (event.clientX + 14) + 'px';
      tip.style.top  = (event.clientY + 14) + 'px';
    })
    .on('mouseleave', () => { document.getElementById('tooltip').style.display = 'none'; });

  // Outer pulse ring
  ng.append('circle').attr('r', R + 10).attr('fill', 'none')
    .attr('stroke', d => COLORS[d.type]).attr('stroke-width', 1.5).attr('stroke-opacity', 0.2);

  // Glow halo
  ng.append('circle').attr('r', R + 4).attr('fill', d => COLORS[d.type])
    .attr('opacity', 0.15).attr('filter', d => `url(#ng-${d.type})`);

  // Main circle
  ng.append('circle').attr('r', R)
    .attr('fill', d => COLORS[d.type])
    .attr('stroke', '#0f172a').attr('stroke-width', 3)
    .attr('filter', d => `url(#ng-${d.type})`);

  // Initial letter
  ng.append('text').attr('text-anchor', 'middle').attr('dy', '0.35em')
    .attr('font-size', 15).attr('font-weight', '800').attr('fill', '#fff')
    .text(d => d.label[0]);

  // Label below
  ng.append('text').attr('text-anchor', 'middle').attr('dy', R + 20)
    .attr('font-size', 12).attr('font-weight', '600').attr('fill', '#e2e8f0')
    .attr('letter-spacing', '0.02em')
    .text(d => d.label);

  // ── Entrance animation ─────────────────────────────────────────────────────
  ng.attr('opacity', 0).transition().duration(700).ease(d3.easeCubicOut).attr('opacity', 1);
  edgeLines.attr('opacity', 0).transition().delay(350).duration(800).attr('opacity', 1);
  edgeG.selectAll('g.elabel').attr('opacity', 0).transition().delay(600).duration(600).attr('opacity', 1);

  // ── Legend ─────────────────────────────────────────────────────────────────
  const legendItems = [
    { color: '#7C3AED', label: 'Protected', isLine: false },
    { color: '#DC2626', label: 'Proxy',     isLine: false },
    { color: '#16A34A', label: 'Legitimate',isLine: false },
    { color: '#6B7280', label: 'Outcome',   isLine: false },
    { color: '#DC2626', label: 'Proxy edge',     isLine: true },
    { color: '#16A34A', label: 'Legit edge',     isLine: true },
  ];

  const legG = svg.append('g').attr('transform', `translate(16, ${H - legendItems.length * 22 - 12})`);
  legendItems.forEach((item, i) => {
    const row = legG.append('g').attr('transform', `translate(0, ${i * 22})`);
    if (item.isLine) {
      row.append('line').attr('x1', 0).attr('y1', 9).attr('x2', 22).attr('y2', 9)
        .attr('stroke', item.color).attr('stroke-width', item.label.includes('Proxy') ? 3.5 : 2.5).attr('opacity', 0.85);
    } else {
      row.append('circle').attr('cx', 11).attr('cy', 9).attr('r', 9).attr('fill', item.color).attr('opacity', 0.9);
    }
    row.append('text').attr('x', 30).attr('y', 13).attr('font-size', 11).attr('fill', '#94a3b8').text(item.label);
  });
}

// ── renderEdges (kept for compatibility) ──────────────────────────────────────

// ── showTooltip ───────────────────────────────────────────────────────────────
const NODE_ROLES = {
  protected:  'Protected attribute: must not causally influence the outcome',
  proxy:      'Proxy variable: correlates with gender, influences hiring outcome',
  legitimate: 'Legitimate variable: valid, non-discriminatory factor',
  outcome:    'Outcome variable: the hiring decision',
};
function showTooltip(event, node) {
  const tooltip = document.getElementById('tooltip');
  tooltip.innerHTML = `<strong>${node.label}</strong><br>${NODE_ROLES[node.type] || node.type}`;
  tooltip.style.display = 'block';
  tooltip.style.left = (event.clientX + 12) + 'px';
  tooltip.style.top  = (event.clientY + 12) + 'px';
}

// ── PDF Download ──────────────────────────────────────────────────────────────
document.getElementById('btn-download-pdf').addEventListener('click', () => {
  const el = document.getElementById('report-text');
  const opt = {
    margin:      [10, 15, 10, 15],
    filename:    'aition-fairness-audit-report.pdf',
    image:       { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, backgroundColor: '#ffffff' },
    jsPDF:       { unit: 'mm', format: 'a4', orientation: 'portrait' },
  };
  // Clone with white background for PDF
  const clone = el.cloneNode(true);
  clone.style.color = '#111';
  clone.style.background = '#fff';
  clone.style.padding = '10px';
  clone.querySelectorAll('h1,h2,h3').forEach(h => h.style.color = '#111');
  clone.querySelectorAll('strong').forEach(s => s.style.color = '#111');
  clone.querySelectorAll('li,p').forEach(e => e.style.color = '#333');
  html2pdf().set(opt).from(clone).save();
});

// ── Event Wiring ──────────────────────────────────────────────────────────────
document.getElementById('btn-demo').addEventListener('click', () => {
  runAudit(new FormData());
});

document.getElementById('csv-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  runAudit(fd);
});
</script>
</body>
